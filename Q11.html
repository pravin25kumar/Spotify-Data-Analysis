</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"name": "data-896193ed66ba904a6d61aa37f2febf08"}, "mark": {"type": "bar"}, "encoding": {"color": {"field": "name", "type": "nominal"}, "tooltip": [{"field": "name", "type": "nominal"}, {"field": "spotify_followers", "type": "quantitative"}], "x": {"field": "spotify_followers", "type": "quantitative"}, "y": {"field": "name", "sort": {"field": "spotify_followers", "order": "descending"}, "type": "nominal"}}, "height": 200, "width": 500, "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json", "datasets": {"data-896193ed66ba904a6d61aa37f2febf08": [{"name": "Taylor Swift", "spotify_followers": 145489371.0}, {"name": "Ed Sheeran", "spotify_followers": 122773292.0}, {"name": "Billie Eilish", "spotify_followers": 118692183.0}, {"name": "The Weeknd", "spotify_followers": 112957721.0}, {"name": "Ariana Grande", "spotify_followers": 107389514.0}, {"name": "Eminem", "spotify_followers": 104539036.0}, {"name": "Drake", "spotify_followers": 103039388.0}, {"name": "Bad Bunny", "spotify_followers": 102536542.0}, {"name": "Justin Bieber", "spotify_followers": 85008100.0}, {"name": "BTS", "spotify_followers": 81189603.0}]}};
